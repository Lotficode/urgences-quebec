name: Collecte horaire

# Le site du MSSS refuse (403) les serveurs de GitHub : la collecte horaire tourne
# sur le Mac (scripts/collecte_locale.sh, planifié avec launchd). Ce workflow reste
# disponible pour un lancement manuel si l'accès est rétabli un jour.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas requests
      - run: python -m urgences.collecte
      - name: Enregistrer les nouveaux relevés
        run: |
          git config user.name "collecte-automatique"
          git config user.email "actions@users.noreply.github.com"
          git add donnees/urgences.db
          git diff --cached --quiet || git commit -m "Relevé $(date -u +'%Y-%m-%d %H:00') UTC"
          git push
